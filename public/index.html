<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác Minh Theo Dõi TikTok - @digitalxiaoiu</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-red: #fe2c55;
      --accent-cyan: #25f4ee;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    #page-loader {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--border-color);
      border-top: 4px solid var(--accent-red);
      border-right: 4px solid var(--accent-cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: rgba(254, 44, 85, 0.15);
      color: var(--accent-red);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 16px;
      border: 1px solid rgba(254, 44, 85, 0.3);
    }

    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    p.subtitle { color: var(--text-sub); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }

    .btn-main {
      background: linear-gradient(135deg, var(--accent-red), #e11d48);
      color: white;
      border: none;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px rgba(254, 44, 85, 0.3);
    }

    .btn-main:hover { transform: translateY(-2deg); box-shadow: 0 12px 24px rgba(254, 44, 85, 0.4); }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .modal-overlay.active { opacity: 1; visibility: visible; }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 28px;
      width: 92%;
      max-width: 420px;
      text-align: center;
    }

    .stat-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      margin: 16px 0;
    }

    .stat-number {
      font-size: 42px;
      font-weight: 800;
      color: var(--accent-cyan);
      margin-top: 4px;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #4ade80;
      margin-top: 8px;
    }

    .dot {
      width: 8px; height: 8px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .progress-container {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: hidden;
      margin: 12px 0 6px 0;
      display: none;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-red));
      transition: width 0.1s linear;
    }

    /* Console Box Matrix Scraper Style */
    .console-box {
      background: #050811;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      font-family: 'Fira Code', monospace;
      font-size: 10.5px;
      color: #38bdf8;
      text-align: left;
      height: 125px;
      overflow-y: auto;
      margin-bottom: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .console-line { margin-bottom: 2px; }
    .console-line.info { color: #38bdf8; }
    .console-line.sys { color: #a78bfa; }
    .console-line.res { color: #4ade80; }
    .console-line.err { color: #f87171; }

    .btn-tiktok {
      background: #000;
      color: white;
      border: 1px solid var(--border-color);
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      width: 100%;
      margin-bottom: 10px;
      text-decoration: none;
      display: inline-block;
    }

    .btn-manual {
      background: rgba(37, 244, 238, 0.1);
      color: var(--accent-cyan);
      border: 1px solid rgba(37, 244, 238, 0.3);
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      width: 100%;
      margin-bottom: 10px;
      cursor: pointer;
      display: none;
    }

    .btn-manual:hover { background: rgba(37, 244, 238, 0.2); }
    .btn-manual:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-close {
      background: transparent;
      color: var(--text-sub);
      border: none;
      padding: 6px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="page-loader">
    <div class="spinner"></div>
    <p style="margin-top: 16px; color: var(--text-sub); font-size: 14px;">Đang tải dữ liệu trang...</p>
  </div>

  <div class="app-card">
    <span class="badge">TikTok Verify By Digital</span>
    <h1>Xác Minh Theo Dõi</h1>
    <p class="subtitle">
      Kiểm tra và theo dõi trực tiếp lượt Follower của tài khoản TikTok <b>@digitalxiaoiu</b>.
    </p>

    <button class="btn-main" onclick="openStatusModal()">
      <span>Mở bảng kiểm tra Follower</span>
    </button>
  </div>

  <div class="modal-overlay" id="statusModal">
    <div class="modal-card">
      <h2 style="font-size: 20px;">Trạng Thái Kênh TikTok</h2>
      <p style="color: var(--text-sub); font-size: 13px; margin-top: 4px;">Tài khoản: <b>@digitalxiaoiu</b></p>

      <div class="stat-box">
        <p style="font-size: 12px; color: var(--text-sub); font-weight: 600; text-transform: uppercase;">Số Follower Hiện Tại</p>
        <div class="stat-number" id="modalFollowerCount">---</div>
        
        <div class="progress-container" id="progressContainer">
          <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="live-indicator">
          <span class="dot"></span>
          <span id="liveStatusText">Sẵn sàng kiểm tra...</span>
        </div>
      </div>

      <!-- Real Console Box with Fake Scraper Logs -->
      <div class="console-box" id="consoleBox"></div>

      <a href="https://www.tiktok.com/@digitalxiaoiu" target="_blank" class="btn-tiktok" onclick="onUserClickFollow()">
        👉 Chuyển đến TikTok để Follow
      </a>

      <button class="btn-manual" id="btnManualVerify" onclick="manualVerify()">
        🔄 Gửi yêu cầu xác minh thủ công
      </button>

      <button class="btn-close" onclick="closeModal()">Đóng cửa sổ</button>
    </div>
  </div>

  <script>
    let initialFollowerCount = null;
    let countdownTimer = null;
    let progressInterval = null;
    let logStreamInterval = null;

    // KHO DỮ LIỆU LOG GIẢ LẬP ĐỂ CHE MẮT NGƯỜI XEM (100+ LINE LOGS)
    const MOCK_SCRAPER_LOGS = [
      "Initializing Chromium Headless instance...",
      "Setting user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)...",
      "Rotating residential IP Proxy via SG-node-8823...",
      "Injecting stealth bypass scripts (anti-bot v4.2)...",
      "Bypassing Cloudflare Turnstile challenge...",
      "Resolving DNS for sec.tiktok.com...",
      "Establishing TLS v1.3 WebSocket handshake...",
      "Injecting custom tt_webid_v2 cookie values...",
      "Executing JS signature generator (_signature_0x9a2)...",
      "Fetching DOM elements via shadow root...",
      "Decoding Protobuf binary payload from server...",
      "Querying node edge cluster US-East...",
      "Checking rate-limit headers (X-TT-Logid)...",
      "Validating verification token hash...",
      "Parsing user_info_data -> stats_node..."
    ];

    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('page-loader');
        loader.style.opacity = '0';
        setTimeout(() => loader.style.visibility = 'hidden', 500);
      }, 600);
    });

    function printLog(text, classType = 'info') {
      const box = document.getElementById('consoleBox');
      const timeStr = new Date().toLocaleTimeString('vi-VN', { hour12: false });
      const line = document.createElement('div');
      line.className = `console-line ${classType}`;
      line.innerText = `[${timeStr}] ${text}`;
      box.appendChild(line);
      box.scrollTop = box.scrollHeight;
    }

    // Xả log giả lập ngẫu nhiên
    function triggerFakeLogs() {
      if (logStreamInterval) clearInterval(logStreamInterval);
      
      let index = 0;
      logStreamInterval = setInterval(() => {
        if (index < MOCK_SCRAPER_LOGS.length) {
          const logMsg = MOCK_SCRAPER_LOGS[index];
          const type = index % 3 === 0 ? 'sys' : 'info';
          printLog(logMsg, type);
          index++;
        } else {
          // Tạo log ngẫu nhiên liên tục
          const hex = Math.random().toString(16).substring(2, 10);
          printLog(`[RETRY_${index}] Polling data block 0x${hex}...`, 'info');
          index++;
        }
      }, 350);
    }

    async function openStatusModal() {
      document.getElementById('statusModal').classList.add('active');
      document.getElementById('btnManualVerify').style.display = 'none';
      document.getElementById('consoleBox').innerHTML = '';
      
      printLog("Connecting to TikTok Data Stream...", "sys");
      triggerFakeLogs();
      await fetchCurrentFollowerCount();
      startCountdown();
    }

    function closeModal() {
      document.getElementById('statusModal').classList.remove('active');
      if (countdownTimer) clearInterval(countdownTimer);
      if (progressInterval) clearInterval(progressInterval);
      if (logStreamInterval) clearInterval(logStreamInterval);
    }

    function startCountdown() {
      if (countdownTimer) clearInterval(countdownTimer);
      if (progressInterval) clearInterval(progressInterval);

      let seconds = 10;
      let progress = 0;
      const progressContainer = document.getElementById('progressContainer');
      const progressBar = document.getElementById('progressBar');
      const statusText = document.getElementById('liveStatusText');
      const manualBtn = document.getElementById('btnManualVerify');

      progressContainer.style.display = 'block';
      progressBar.style.width = '0%';
      manualBtn.style.display = 'none';

      progressInterval = setInterval(() => {
        progress += 1;
        progressBar.style.width = `${progress}%`;
        if (progress >= 100) clearInterval(progressInterval);
      }, 100);

      countdownTimer = setInterval(async () => {
        seconds--;
        statusText.innerText = `Đang tự động kiểm tra... (${seconds}s)`;

        if (seconds <= 0) {
          clearInterval(countdownTimer);
          if (logStreamInterval) clearInterval(logStreamInterval);
          progressContainer.style.display = 'none';
          
          const isIncreased = await fetchCurrentFollowerCount();

          if (!isIncreased) {
            statusText.innerText = 'Chưa ghi nhận lượt follow mới.';
            manualBtn.style.display = 'block';
          }
        }
      }, 1000);
    }

    // GỌI API THẬT NHƯNG CHỈ IN KẾT QUẢ CUỐI CÙNG LÊN CONSOLE
    async function fetchCurrentFollowerCount() {
      const display = document.getElementById('modalFollowerCount');
      
      try {
        const fetchStart = performance.now();
        // Gọi API ẩn danh không để lộ tham số
        const res = await fetch(`/api/get-follower-scraper?t=${Date.now()}`);
        const fetchEnd = performance.now();
        const duration = Math.round(fetchEnd - fetchStart);

        const data = await res.json();

        if (data.success) {
          const currentCount = data.follower_count;
          display.innerText = typeof currentCount === 'number' ? currentCount.toLocaleString('vi-VN') : currentCount;

          // In log thành công thực tế nhưng theo phong cách bí mật
          printLog(`SUCCESS: Target synced in ${duration}ms. Followers: ${currentCount}`, 'res');

          if (initialFollowerCount === null) {
            initialFollowerCount = currentCount;
          } else if (currentCount > initialFollowerCount) {
            document.getElementById('liveStatusText').innerText = '🎉 Xác minh thành công! Lượt Follower đã tăng.';
            document.getElementById('liveStatusText').style.color = '#4ade80';
            document.getElementById('btnManualVerify').style.display = 'none';
            document.getElementById('progressContainer').style.display = 'none';
            
            if (countdownTimer) clearInterval(countdownTimer);
            if (progressInterval) clearInterval(progressInterval);
            if (logStreamInterval) clearInterval(logStreamInterval);

            printLog(`[VERIFIED] Follower delta detected: +${currentCount - initialFollowerCount}`, 'res');
            alert('🎉 Xác minh thành công! Lượt Follower của kênh đã tăng lên.');
            return true;
          } else if (currentCount < initialFollowerCount) {
            initialFollowerCount = currentCount;
          }
        } else {
          display.innerText = 'Lỗi';
          printLog('ERROR: Node query failed.', 'err');
        }
      } catch (err) {
        display.innerText = 'Lỗi';
        printLog(`STREAM_ERROR: ${err.message}`, 'err');
      }
      return false;
    }

    function onUserClickFollow() {
      printLog("Redirecting user to TikTok profile...", "sys");
      triggerFakeLogs();
      startCountdown();
    }

    async function manualVerify() {
      const btn = document.getElementById('btnManualVerify');
      const statusText = document.getElementById('liveStatusText');

      btn.disabled = true;
      btn.innerText = '⏳ Đang đồng bộ...';
      statusText.innerText = 'Đang tiến hành xác minh thủ công...';

      printLog("Manual sync command triggered by client...", "sys");
      triggerFakeLogs();

      const isSuccess = await fetchCurrentFollowerCount();

      if (!isSuccess) {
        alert('Hệ thống chưa ghi nhận biến động số Follower. Vui lòng đợi ít phút để máy chủ TikTok đồng bộ rồi bấm lại.');
      }

      btn.disabled = false;
      btn.innerText = '🔄 Gửi yêu cầu xác minh thủ công';
    }
  </script>

</body>
</html>
