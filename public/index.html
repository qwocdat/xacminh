<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác Minh Theo Dõi TikTok - @digitalxiaoiu</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-red: #fe2c55;
      --accent-cyan: #25f4ee;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Loading Toan Man Hinh */
    #page-loader {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--border-color);
      border-top: 4px solid var(--accent-red);
      border-right: 4px solid var(--accent-cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Card Giao Dien Chinh */
    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: rgba(254, 44, 85, 0.15);
      color: var(--accent-red);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 16px;
      border: 1px solid rgba(254, 44, 85, 0.3);
    }

    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    p.subtitle { color: var(--text-sub); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }

    .btn-main {
      background: linear-gradient(135deg, var(--accent-red), #e11d48);
      color: white;
      border: none;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px rgba(254, 44, 85, 0.3);
    }

    .btn-main:hover { transform: translateY(-2deg); box-shadow: 0 12px 24px rgba(254, 44, 85, 0.4); }

    /* Pop-up Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .modal-overlay.active { opacity: 1; visibility: visible; }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 32px;
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    .stat-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      margin: 20px 0;
    }

    .stat-number {
      font-size: 42px;
      font-weight: 800;
      color: var(--accent-cyan);
      margin-top: 4px;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #4ade80;
      margin-top: 10px;
    }

    .dot {
      width: 8px; height: 8px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .btn-tiktok {
      background: #000;
      color: white;
      border: 1px solid var(--border-color);
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      width: 100%;
      margin-bottom: 12px;
      text-decoration: none;
      display: inline-block;
    }

    .btn-close {
      background: transparent;
      color: var(--text-sub);
      border: none;
      padding: 8px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Screen Loader -->
  <div id="page-loader">
    <div class="spinner"></div>
    <p style="margin-top: 16px; color: var(--text-sub); font-size: 14px;">Đang khởi tạo dữ liệu...</p>
  </div>

  <!-- Main App Card -->
  <div class="app-card">
    <span class="badge">TikTok Real-time</span>
    <h1>Xác Minh Theo Dõi</h1>
    <p class="subtitle">
      Kiểm tra và theo dõi trực tiếp lượt Follower của tài khoản TikTok <b>@digitalxiaoiu</b>.
    </p>

    <button class="btn-main" onclick="openStatusModal()">
      <span>Mở bảng kiểm tra Follower</span>
    </button>
  </div>

  <!-- Pop-up Modal -->
  <div class="modal-overlay" id="statusModal">
    <div class="modal-card">
      <h2 style="font-size: 20px;">Trạng Thái Kênh TikTok</h2>
      <p style="color: var(--text-sub); font-size: 13px; margin-top: 4px;">Tài khoản: <b>@digitalxiaoiu</b></p>

      <div class="stat-box">
        <p style="font-size: 12px; color: var(--text-sub); font-weight: 600; text-transform: uppercase;">Số Follower Hiện Tại</p>
        <div class="stat-number" id="modalFollowerCount">---</div>
        <div class="live-indicator">
          <span class="dot"></span>
          <span id="liveStatusText">Sẵn sàng kiểm tra...</span>
        </div>
      </div>

      <a href="https://www.tiktok.com/@digitalxiaoiu" target="_blank" class="btn-tiktok" onclick="onUserClickFollow()">
        👉 Chuyển đến TikTok để Follow
      </a>

      <button class="btn-close" onclick="closeModal()">Đóng cửa sổ</button>
    </div>
  </div>

  <script>
    let initialFollowerCount = null;
    let pollingInterval = null;

    // Tat loader
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('page-loader');
        loader.style.opacity = '0';
        setTimeout(() => loader.style.visibility = 'hidden', 500);
      }, 600);
    });

    async function openStatusModal() {
      document.getElementById('statusModal').classList.add('active');
      await fetchCurrentFollowerCount();
    }

    function closeModal() {
      document.getElementById('statusModal').classList.remove('active');
      if (pollingInterval) clearInterval(pollingInterval);
    }

    async function fetchCurrentFollowerCount() {
      const display = document.getElementById('modalFollowerCount');
      
      try {
        const res = await fetch('/api/get-follower-scraper');
        const data = await res.json();

        if (data.success) {
          const currentCount = data.follower_count;
          display.innerText = typeof currentCount === 'number' ? currentCount.toLocaleString('vi-VN') : currentCount;

          if (initialFollowerCount === null) {
            initialFollowerCount = currentCount;
          } else if (currentCount > initialFollowerCount) {
            document.getElementById('liveStatusText').innerText = '🎉 Xác minh thành công! Số Follower đã tăng.';
            document.getElementById('liveStatusText').style.color = '#4ade80';
            alert('🎉 Xác minh thành công! Hệ thống ghi nhận lượt Follow mới.');
            if (pollingInterval) clearInterval(pollingInterval);
          }
        } else {
          display.innerText = 'Lỗi';
        }
      } catch (err) {
        display.innerText = 'Lỗi';
        console.error(err);
      }
    }

    function onUserClickFollow() {
      document.getElementById('liveStatusText').innerText = 'Đang tự động kiểm tra xem số Follower đã tăng chưa...';
      if (pollingInterval) clearInterval(pollingInterval);
      pollingInterval = setInterval(fetchCurrentFollowerCount, 8000);
    }
  </script>

</body>
</html>
