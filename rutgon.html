<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Cụ Tạo Link Liên Kết Nhanh</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 550px;
            border: 1px solid #334155;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #38bdf8;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #94a3b8;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: #0369a1;
        }

        button:active {
            transform: scale(0.98);
        }

        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #0f172a;
            border-radius: 8px;
            border: 1px dashed #38bdf8;
            display: none;
        }

        .result-box p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .result-link-wrapper {
            display: flex;
            gap: 10px;
        }

        .result-link-wrapper input {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            color: #38bdf8;
        }

        .btn-copy {
            width: auto;
            padding: 10px 15px;
            background-color: #22c55e;
            font-size: 14px;
        }

        .btn-copy:hover {
            background-color: #16a34a;
        }

        .error-message {
            color: #ef4444;
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Rút Gọn Link Nhanh</h2>
    
    <div class="input-group">
        <label for="destinationUrl">Nhập liên kết đích (URL):</label>
        <input type="text" id="destinationUrl" placeholder="VD: https://google.com hoặc https://youtube.com">
        <div class="error-message" id="errorMsg">Vui lòng nhập một URL hợp lệ (VD: https://example.com)</div>
    </div>

    <button onclick="generateLink()">Tạo Link Rút Gọn</button>

    <div class="result-box" id="resultBox">
        <p>Kết quả link rút gọn của bạn:</p>
        <div class="result-link-wrapper">
            <input type="text" id="shortenedUrl" readonly>
            <button class="btn-copy" onclick="copyLink()">Sao chép</button>
        </div>
    </div>
</div>

<script>
    // API Key của bạn
    const API_KEY = "6992df868b3d1e423d1ab833";

    function generateLink() {
        const inputUrl = document.getElementById("destinationUrl").value.trim();
        const errorMsg = document.getElementById("errorMsg");
        const resultBox = document.getElementById("resultBox");
        const shortenedUrlInput = document.getElementById("shortenedUrl");

        // Kiểm tra xem người dùng đã nhập link chưa
        if (!inputUrl) {
            errorMsg.innerText = "Vui lòng nhập liên kết!";
            errorMsg.style.display = "block";
            resultBox.style.display = "none";
            return;
        }

        // Tự động thêm https:// nếu người dùng quên nhập
        let formattedUrl = inputUrl;
        if (!/^https?:\/\//i.test(formattedUrl)) {
            formattedUrl = 'https://' + formattedUrl;
        }

        // Ẩn thông báo lỗi nếu có
        errorMsg.style.display = "none";

        // Sử dụng Quick Link API format của Link4M
        const finalShortenedUrl = `https://link4m.co/st?api=${API_KEY}&url=${encodeURIComponent(formattedUrl)}`;

        // Hiển thị kết quả
        shortenedUrlInput.value = finalShortenedUrl;
        resultBox.style.display = "block";
    }

    function copyLink() {
        const shortenedUrlInput = document.getElementById("shortenedUrl");
        shortenedUrlInput.select();
        shortenedUrlInput.setSelectionRange(0, 99999); // Dành cho thiết bị di động

        navigator.clipboard.writeText(shortenedUrlInput.value).then(() => {
            alert("Đã sao chép link vào bộ nhớ tạm!");
        }).catch(err => {
            alert("Lỗi khi sao chép link, vui lòng sao chép thủ công.");
        });
    }
</script>

</body>
</html>
